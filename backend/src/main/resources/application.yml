spring:
  application:
    name: labflow-backend

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  application:
    name: LabFlow
    version: 0.1.0

labflow:
  web:
    frontend-origin: ${LABFLOW_FRONTEND_ORIGIN:http://localhost:5173}
