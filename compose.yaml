name: labflow

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command:
      - start-dev
      - --import-realm
    init: true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://keycloak.localhost:8180
      KC_TRANSACTION_DEFAULT_TIMEOUT: "900"
      JAVA_OPTS_APPEND: -Djava.security.egd=file:/dev/urandom
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./identity/labflow-realm.json:/opt/keycloak/data/import/labflow-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
      - --disableProductStyleUrl
    init: true
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:10000/', response => process.exit(response.statusCode ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
    init: true
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: oidc
      LABFLOW_FRONTEND_ORIGIN: http://localhost
      LABFLOW_STORAGE_MODE: azure
      AZURE_STORAGE_CONTAINER: labflow
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      OIDC_PUBLIC_ISSUER_URI: http://keycloak.localhost:8180/realms/labflow
      JAVA_TOOL_OPTIONS: -Djdk.httpclient.allowRestrictedHeaders=content-length
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      azurite:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8080/actuator/health
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    init: true
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1/healthz
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  azurite-data:
