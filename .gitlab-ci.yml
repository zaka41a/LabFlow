stages:
  - test
  - plan
  - provision
  - image
  - deploy
  - verify
  - teardown

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Djava.awt.headless=true
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_NAME: "labflow-dev"
  LABFLOW_AZURE_AUTH_MODE: "auto"
  LABFLOW_AZURE_ENABLED: "false"

ci:test:
  stage: test
  script:
    - bash -n ci/*.sh
    - for test_script in ci/test-*.sh; do bash "$test_script"; done

backend:test:
  stage: test
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .ci-tools/jdk-21.0.12+8/
      - .ci-tools/apache-maven-3.9.11/
      - .m2/repository
  before_script:
    - source ci/bootstrap-java.sh
    - source ci/bootstrap-maven.sh
  script:
    - cd backend
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml

frontend:test:
  stage: test
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .ci-tools/node-v22.19.0-linux-x64/
      - .npm/
  before_script:
    - source ci/bootstrap-node.sh
    - cd frontend
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline --no-audit --no-fund
  script:
    - npm run format:check
    - npm run typecheck
    - npm test -- --run
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day

tofu:validate:
  stage: test
  script:
    - tofu version
    - cd infra
    - tofu fmt -check -recursive
    - tofu init -backend=false
    - tofu validate

.tofu_remote_state:
  id_tokens:
    AZURE_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  variables:
    TF_HTTP_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
    TF_HTTP_LOCK_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
    TF_HTTP_UNLOCK_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
    TF_HTTP_USERNAME: "gitlab-ci-token"
    TF_HTTP_PASSWORD: "$CI_JOB_TOKEN"
    TF_HTTP_LOCK_METHOD: "POST"
    TF_HTTP_UNLOCK_METHOD: "DELETE"
    TF_HTTP_RETRY_WAIT_MIN: "5"
  before_script:
    - source ci/azure-auth.sh
    - labflow_configure_azure_auth
    - cd infra
    - tofu init -reconfigure

azure:preflight:
  stage: plan
  id_tokens:
    AZURE_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  needs:
    - backend:test
    - ci:test
    - frontend:test
    - tofu:validate
  before_script:
    - source ci/azure-auth.sh
    - labflow_configure_azure_auth
  script:
    - bash ci/azure-preflight.sh
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

tofu:plan:
  extends: .tofu_remote_state
  stage: plan
  needs:
    - backend:test
    - ci:test
    - frontend:test
    - tofu:validate
  script:
    - tofu plan -out=labflow.tfplan
  artifacts:
    access: developer
    paths:
      - infra/labflow.tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $LABFLOW_AZURE_ENABLED == "true"'

azure:provision:
  extends: .tofu_remote_state
  stage: provision
  resource_group: labflow-azure-development
  needs:
    - job: tofu:plan
      artifacts: true
  script:
    - tofu apply -auto-approve labflow.tfplan
    - printf 'ACR_NAME=%s\n' "$(tofu output -raw container_registry_name)" > ../deployment.env
    - printf 'RESOURCE_GROUP=%s\n' "$(tofu output -raw resource_group_name)" >> ../deployment.env
    - printf 'VM_NAME=%s\n' "$(tofu output -raw virtual_machine_name)" >> ../deployment.env
    - printf 'APPLICATION_URL=%s\n' "$(tofu output -raw application_url)" >> ../deployment.env
    - printf 'OIDC_CLIENT_AUTHENTICATION_METHOD=%s\n' "$(tofu output -raw oidc_client_authentication_method)" >> ../deployment.env
  artifacts:
    reports:
      dotenv: deployment.env
  environment:
    name: azure/development
    url: $APPLICATION_URL
    on_stop: azure:destroy
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $LABFLOW_AZURE_ENABLED == "true"'

.azure_cli:
  id_tokens:
    AZURE_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  before_script:
    - source ci/azure-auth.sh
    - labflow_configure_azure_auth

azure:image:
  extends: .azure_cli
  stage: image
  resource_group: labflow-azure-development
  needs:
    - job: azure:provision
      artifacts: true
  script:
    - >-
      az acr build --registry "$ACR_NAME"
      --image "labflow-backend:${CI_COMMIT_SHA}"
      --image "labflow-backend:latest"
      backend
    - >-
      az acr build --registry "$ACR_NAME"
      --image "labflow-frontend:${CI_COMMIT_SHA}"
      --image "labflow-frontend:latest"
      frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $LABFLOW_AZURE_ENABLED == "true"'

azure:deploy:
  extends: .azure_cli
  stage: deploy
  resource_group: labflow-azure-development
  needs:
    - job: azure:provision
      artifacts: true
    - azure:image
  script:
    - |
      set -Eeuo pipefail

      registry_server="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
      registry_username="$(az acr credential show --name "$ACR_NAME" --query username --output tsv)"
      registry_password="$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' --output tsv)"
      registry_password_base64="$(printf '%s' "$registry_password" | base64 | tr -d '\n=')"
      unset registry_password

      az vm run-command invoke \
        --resource-group "$RESOURCE_GROUP" \
        --name "$VM_NAME" \
        --command-id RunShellScript \
        --scripts @ci/azure-deploy-vm.sh \
        --parameters \
        "$registry_server" \
        "$registry_username" \
        "$registry_password_base64" \
        "$CI_COMMIT_SHA" \
        "$OIDC_CLIENT_AUTHENTICATION_METHOD" \
        --query 'value[0].message' \
        --output tsv
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $LABFLOW_AZURE_ENABLED == "true"'

azure:verify:
  stage: verify
  needs:
    - job: azure:provision
      artifacts: true
    - azure:deploy
    - job: frontend:test
      artifacts: true
  script:
    - curl --fail --show-error --silent --retry 18 --retry-all-errors --retry-delay 10 "$APPLICATION_URL/healthz"
    - curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 5 "$APPLICATION_URL/api/auth/config"
    - |
      set -Eeuo pipefail

      expected_frontend_asset="$(sed -nE 's|.*src="([^"]+\.js)".*|\1|p' frontend/dist/index.html)"
      if [[ -z "$expected_frontend_asset" ]]; then
        printf '%s\n' 'Unable to determine the tested frontend asset.' >&2
        exit 1
      fi

      deployed_index="$(mktemp)"
      callback_headers="$(mktemp)"
      trap 'rm -f "$deployed_index" "$callback_headers"' EXIT

      curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 5 \
        --output "$deployed_index" "$APPLICATION_URL/"
      if ! grep --fixed-strings --quiet -- "src=\"${expected_frontend_asset}\"" "$deployed_index"; then
        printf 'Azure is not serving the tested frontend asset %s.\n' "$expected_frontend_asset" >&2
        exit 1
      fi

      curl --show-error --silent --dump-header "$callback_headers" --output /dev/null \
        "$APPLICATION_URL/login/oauth2/code/labflow?code=deployment-check&state=deployment-check"
      if ! grep --fixed-strings --quiet -- 'login=oidc_error&reason=' "$callback_headers" || \
         ! grep --fixed-strings --quiet -- '&reference=' "$callback_headers"; then
        printf '%s\n' 'Azure is not serving the tested backend OIDC failure handler.' >&2
        exit 1
      fi
  environment:
    name: azure/development
    url: $APPLICATION_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $LABFLOW_AZURE_ENABLED == "true"'

azure:destroy:
  extends: .tofu_remote_state
  stage: teardown
  resource_group: labflow-azure-development
  script:
    - tofu destroy -auto-approve
  environment:
    name: azure/development
    action: stop
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $LABFLOW_AZURE_ENABLED == "true"'
