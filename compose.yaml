name: labflow

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
    init: true
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:10000/', response => process.exit(response.statusCode ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
    init: true
    environment:
      SERVER_PORT: "8080"
      LABFLOW_FRONTEND_ORIGIN: http://localhost:5173
      LABFLOW_STORAGE_MODE: memory
      AZURE_STORAGE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8080/actuator/health
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    init: true
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1/healthz
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  azurite-data:
